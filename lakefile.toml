name = "MipsSim"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MipsSim"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "MipsSim"

[[lean_exe]]
name = "DiffHarness"
root = "DiffHarness"

