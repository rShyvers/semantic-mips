name = "Semantics"
version = "0.1.0"
keywords = ["math"]
# `Checked` (not `Semantics`) is the default target on purpose: it is the
# sorry-free subset that `lake check` kernel-replays. See `Checked.lean`
# and the "Verification gates" section of the root README. `Semantics`
# (the full library, including the 3 documented `sorry`s in
# `Semantics.Specs.StepSpec`) is still buildable with `lake build Semantics`.
defaultTargets = ["Checked", "DiffHarness"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "Semantics"

[[lean_lib]]
name = "Checked"

[[lean_exe]]
name = "DiffHarness"
root = "DiffHarness"

[[lean_exe]]
name = "EquivHarness"
root = "EquivHarness"

# Deliberately *not* in `defaultTargets`, same as `EquivHarness` above: `lake
# check` combines every default-target exe's root module into one
# `Lean.importModules` call (see `Lake/CLI/Main.lean`'s `checkExport`), and
# since every `lean_exe` root must define a top-level `def main` (Lake's
# literal entry-point convention), a second default-target exe collides with
# `DiffHarness`'s `main` ("environment already contains 'main' from
# DiffHarness") and fails `lake check` outright. Build this one explicitly:
# `lake build MipsRun` (or `lake exe MipsRun`).
[[lean_exe]]
name = "MipsRun"
root = "MipsRun"

