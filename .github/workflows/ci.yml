name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan + Lean toolchain (pinned in lean-toolchain)
        run: curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
      - name: Restore .lake cache (packages + mathlib build)
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('lean-toolchain') }}
      - name: Fetch mathlib build cache (no-op when restored from cache)
        run: ~/.elan/bin/lake exe cache get
      - name: Build all targets (Semantics incl. StepSpec, Checked, DiffHarness; includes unit tests / #guard)
        run: ~/.elan/bin/lake build Semantics Checked DiffHarness
      - name: Kernel replay gate (lake check on the zero-sorry target)
        run: ~/.elan/bin/lake check
      - name: Trusted-statement gate (lake comparator on the 8-theorem trusted surface)
        run: ~/.elan/bin/lake comparator
      - name: Differential test vs real MARS 4.5
        run: ~/.elan/bin/lake exe DiffHarness
