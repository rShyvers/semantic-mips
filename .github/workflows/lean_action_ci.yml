name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      # `lean-action` builds the default targets (`Checked`, `DiffHarness`);
      # `MipsSim.Specs.StepSpec` (3 documented `sorry`s, excluded from the
      # sorry-free `Checked` target so `lake check` stays meaningful) is
      # still built in CI here, so every module in the project is compiled
      # on every push even though it isn't in the `lake check` gate.
      - name: Build full MipsSim library (includes StepSpec)
        working-directory: MipsSim
        run: lake build MipsSim
